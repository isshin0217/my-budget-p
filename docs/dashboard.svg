<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif">
  <title>대시보드 화면 예시</title>
  <!-- 폰 테두리 -->
  <rect x="2" y="2" width="356" height="636" rx="36" fill="#ffffff" stroke="#d0d4da" stroke-width="3"/>
  <rect x="140" y="16" width="80" height="8" rx="4" fill="#e3e6ea"/>

  <!-- 머리 -->
  <text x="28" y="66" font-size="12" font-weight="600" fill="#6b7280">Left to spend this month</text>
  <text x="28" y="84" font-size="12" fill="#9ca3af">10/01 – 10/31 · 13 days left</text>
  <text x="28" y="134" font-size="40" font-weight="700" fill="#1B7F3B">₩304,511</text>
  <text x="28" y="156" font-size="12" fill="#6b7280">₩23,424 a day from here · ₩41,200 under pace</text>

  <!-- 막대 + 페이스 눈금 -->
  <rect x="28" y="172" width="304" height="10" rx="5" fill="#e9ecef"/>
  <rect x="28" y="172" width="150" height="10" rx="5" fill="#1B7F3B"/>
  <rect x="178" y="172" width="24" height="10" fill="#1B7F3B" opacity=".35"/>
  <rect x="194" y="172" width="3" height="10" fill="#ffffff"/>
  <text x="28" y="198" font-size="11" fill="#9ca3af">₩695,489 spent · ₩60,000 reserved</text>
  <text x="332" y="198" font-size="11" fill="#9ca3af" text-anchor="end">₩1,060,000 limit</text>

  <!-- 착지 예상 -->
  <rect x="28" y="214" width="304" height="54" rx="12" fill="#eef6f0"/>
  <text x="42" y="238" font-size="14" font-weight="700" fill="#1B7F3B">On track for ₩1,842,000 this month</text>
  <text x="42" y="256" font-size="11" fill="#6b7280">₩158,000 under budget</text>

  <!-- 이번 달 카드 -->
  <text x="28" y="296" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="1">THIS MONTH</text>
  <line x1="28" y1="302" x2="332" y2="302" stroke="#eceef1"/>
  <rect x="28" y="312" width="148" height="62" rx="12" fill="#f6f7f9"/>
  <text x="40" y="334" font-size="11" fill="#6b7280">Card bill this month</text>
  <text x="40" y="358" font-size="17" font-weight="600" fill="#1a1a1a">₩1,182,400</text>
  <rect x="184" y="312" width="148" height="62" rx="12" fill="#f6f7f9"/>
  <text x="196" y="334" font-size="11" fill="#6b7280">Monthly budget</text>
  <text x="196" y="358" font-size="17" font-weight="600" fill="#1a1a1a">₩2,000,000</text>

  <!-- 카테고리 막대 -->
  <text x="28" y="400" font-size="12" font-weight="600" fill="#6b7280">Where the card went this month</text>
  <text x="28" y="426" font-size="13" fill="#1a1a1a">Food</text>
  <text x="332" y="426" font-size="13" fill="#1a1a1a" text-anchor="end">₩312,000</text>
  <rect x="28" y="432" width="304" height="6" rx="3" fill="#3A6EA5"/>
  <rect x="28" y="440" width="250" height="4" rx="2" fill="#3A6EA5" opacity=".28"/>
  <text x="28" y="466" font-size="13" fill="#1a1a1a">Taxi</text>
  <text x="332" y="466" font-size="13" fill="#1a1a1a" text-anchor="end">₩148,500</text>
  <rect x="28" y="472" width="145" height="6" rx="3" fill="#3A6EA5"/>
  <rect x="28" y="480" width="190" height="4" rx="2" fill="#3A6EA5" opacity=".28"/>
  <text x="28" y="506" font-size="13" fill="#1a1a1a">Cafe</text>
  <text x="332" y="506" font-size="13" fill="#1a1a1a" text-anchor="end">₩86,200</text>
  <rect x="28" y="512" width="84" height="6" rx="3" fill="#3A6EA5"/>
  <rect x="28" y="520" width="70" height="4" rx="2" fill="#3A6EA5" opacity=".28"/>
  <text x="28" y="540" font-size="10" fill="#9ca3af">진한 막대 = 이번 달 · 옅은 막대 = 지난달 같은 날까지</text>

  <!-- 최근 내역 -->
  <text x="28" y="570" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="1">THIS MONTH · RECENT</text>
  <line x1="28" y1="576" x2="332" y2="576" stroke="#eceef1"/>
  <text x="28" y="598" font-size="11" fill="#9ca3af">10/17</text>
  <text x="66" y="598" font-size="13" fill="#1a1a1a">Taxi</text>
  <text x="100" y="598" font-size="11" fill="#9ca3af">UBER*TRIPHELP</text>
  <text x="332" y="598" font-size="13" fill="#1a1a1a" text-anchor="end">₩18,234</text>
  <text x="28" y="622" font-size="11" fill="#9ca3af">10/16</text>
  <text x="66" y="622" font-size="13" fill="#1a1a1a">Cafe</text>
  <text x="100" y="622" font-size="11" fill="#9ca3af">Starbucks Gangnam</text>
  <text x="332" y="622" font-size="13" fill="#1a1a1a" text-anchor="end">₩6,500</text>
</svg>
